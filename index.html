 <div class=sc><svg viewBox="0 0 ${W} ${H}" style="min-width:640px;width:100%">${gy}${gx}<polyline fill=none stroke="var(--meta)" stroke-width=2 stroke-dasharray="5 4" points="${pl(b)}"/><polyline fill=none stroke="var(--rec)" stroke-width=1.6 points="${pl(a)}"/></svg></div><span class=p>━ Receita</span> &nbsp; <span style="color:var(--meta)">╍ Meta variável</span></div>`}
function det(){const ms=dm??(+S.lanc.reduce((a,x)=>x.d>a?x.d:a,'').slice(5,7)-1),a=S.lanc.filter(x=>x.f=='DESPESA'&&(ms<0||+x.d.slice(5,7)-1==ms)),g={};
 a.forEach(x=>{const t=g[x.t]??={v:0,s:{}};t.v+=x.v;t.s[x.s||'(sem subtipo)']=(t.s[x.s||'(sem subtipo)']||0)+x.v});const tot=a.reduce((n,x)=>n+x.v,0);
 return`<h2>Despesas detalhadas</h2><div class=f><label>Período<select onchange="dm=+this.value;go()"><option value=-1 ${ms<0?'selected':''}>Ano todo${MES.map((m,i)=>`<option value=${i} ${ms==i?'selected':''}>${MESF[i]}`).join('')}</select></label></div><div class=box>${Object.entries(g).sort((x,y)=>y[1].v-x[1].v).map(([t,o])=>`<details><summary><span>${esc(t)}</span><span>${R(o.v)} · ${P(o.v/tot)}</span></summary>${Object.entries(o.s).sort((x,y)=>y[1]-x[1]).map(([s,v])=>`<div class=sub><span>${esc(s)}</span><span>${R(v)}</span></div>`).join('')}</details>`).join('')||'<p class=note>Sem despesas neste período.</p>'}<div class=sub style="padding:10px 0 0;font-weight:700;color:var(--ink)"><span>Total geral</span><span>${R(tot)}</span></div></div>`}
function fixSt(f){if(f.m)return fixV(f)>=f.v?'OK':'PARCIAL';return S.ok[fm+':'+f.id]?'OK':''}
function fixV(f){if(!f.m)return 0;return S.lanc.filter(x=>x.f=='DESPESA'&&+x.d.slice(5,7)-1==fm&&x[f.m[0]]==f.m[1]).reduce((n,x)=>n+x.v,0)}

 if(!a!=!t)return alert('Informe a parcela atual e o total de parcelas, ou deixe os dois em branco.');if(a>t)return alert('A parcela atual não pode ser maior que o total.');
 const f=fe==null?null:S.fix.find(y=>y.id==fe);x.o=a?a+' DE '+t:(f&&!parc(f)?f.o:'');
 if(f)Object.assign(f,x);else{x.m=null;x.id=Math.max(-1,...S.fix.map(y=>y.id))+1;S.fix.push(x)}fe=null;save();go()}

function pp(id,d){const f=S.fix.find(y=>y.id==id),q=parc(f);if(!q)return;f.o=Math.min(q[1],Math.max(1,q[0]+d))+' DE '+q[1];save();go()}
function fix(){let pg=0,pe=0,pa=0,tv=0,tp=0;const e=fe==null?null:S.fix.find(f=>f.id==fe),q0=e&&parc(e),cats=[...new Set(S.fix.map(f=>f.c))].sort();
 const b=S.fix.map(f=>{const st=fixSt(f),v=fixV(f),q=parc(f);tv+=f.v;tp+=v;if(st=='OK')pg+=f.v;else if(st=='')pe+=f.v;else pa+=f.v;
  const ob=q?`<span class=stp><button class="b g" onclick="pp(${f.id},-1)" aria-label="Parcela anterior" ${q[0]<=1?'disabled':''}>−</button><b>${q[0]} DE ${q[1]}</b><button class="b g" onclick="pp(${f.id},1)" aria-label="Próxima parcela" ${q[0]>=q[1]?'disabled':''}>+</button></span>${q[0]>=q[1]?' <span class="tg ok">ÚLTIMA</span>':''}`:esc(f.o);
  return`<tr><td data-l="Data">DIA ${f.dia}<td data-l="Valor">${R(f.v)}<td data-l="Mês atual">${f.m?R(v):''}<td class=l data-l="Item">${esc(f.i)}<td class=l data-l="Categoria">${esc(f.c)}<td data-l="Pagamento">${f.m?`<span class="tg ${st=='OK'?'ok':'pa'}">${st}</span>`:`<input type=checkbox ${st?'checked':''} onchange="S.ok['${fm}:${f.id}']=this.checked;save();go()" aria-label="Pago"> <span class="tg ${st?'ok':''}">${st||'PENDENTE'}</span>`}<td class=l data-l="Observação">${ob}<td class=ax><button class="b g" onclick="edF(${f.id})">Editar</button> <button class="b g" onclick="delF(${f.id})">Excluir</button></tr>`}).join('');
 return`<h2>Despesas fixas</h2><div class=box><span class=bt>${e?'Editar despesa fixa':'Cadastrar despesa fixa'}</span><form class=f onsubmit="addF(event)"><label>Dia<input type=number min=1 max=31 id=xd required style="width:80px" value="${e?e.dia:''}"></label><label>Valor<input type=number step=.01 inputmode=decimal id=xv required style="width:110px" value="${e?e.v:''}"></label><label>Item<input id=xi required value="${e?esc(e.i):''}"></label><label>Categoria<input id=xc list=xl required value="${e?esc(e.c):''}"></label><label>Parcela atual<input type=number min=1 id=xp placeholder="opcional" style="width:110px" value="${q0?q0[0]:''}"></label><label>Total de parcelas<input type=number min=1 id=xt placeholder="opcional" style="width:130px" value="${q0?q0[1]:''}"></label><button class=b>${e?'Salvar alteração':'Adicionar'}</button>${e?'<button type=button class="b g" onclick="fe=null;go()">Cancelar</button>':''}</form><datalist id=xl>${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><p class=note style="margin:0">Despesa parcelada: preencha parcela atual e total. Depois use − e + na tabela para avançar a parcela a cada mês.</p></div>
 <div class=f><label>Mês<select onchange="fm=+this.value;go()">${MESF.map((m,i)=>`<option value=${i} ${fm==i?'selected':''}>${m}`).join('')}</select></label></div><div class=kv><div><small>Pago</small><b class=p>${R(pg)}</b></div><div><small>Pendente</small><b class=n>${R(pe)}</b></div><div><small>Parcial</small><b>${R(pa)}</b></div></div><div class="box sc"><table class=rs><thead><tr><th>Data<th>Valor<th>Mês atual<th class=l>Item<th class=l>Categoria<th>Pagamento<th class=l>Observação<th></tr></thead><tbody>${b}</tbody><tfoot><tr><td data-l="Total">TOTAL<td data-l="Valor">${R(tv)}<td data-l="Mês atual">${R(tp)}<td colspan=5></tr></tfoot></table></div><p class=note>Itens com regra (supermercado, combustível, lazer, diarista, remédio) somam os lançamentos do mês e ficam OK quando atingem o valor; os demais você marca como pago.</p>`}
function dad(){const c=C,o=(k,v,n)=>`<div><small>${k}</small><b ${n?`class=${cl(v)}`:''}>${typeof v=='number'&&!/dias/i.test(k)?R(v):v}</b></div>`,mm=dm??-1;
 return`<h2>Dados diários e parâmetros</h2><div class=kv>${o('Dias trabalhados',c.dt)}${o('Total de dias',S.cfg.dias)}${o('Dias restantes',c.rest)}<div><small>Meta do ano</small><input type=number value=${S.cfg.meta} onchange="S.cfg.meta=+this.value;save();go()" style="width:100%;font-weight:600"></div>${o('Meta por dia',c.md)}${o('Receita realizada',c.real)}${o('Meta até o momento',c.ate)}${o('Déficit',c.def,1)}${o('Déficit diluído por dia',c.dil)}${o('Meta real por dia',c.mr)}</div>
 <div class=f><label>Mês<select onchange="dm=+this.value;go()"><option value=-1>Ano todo${MES.map((m,i)=>`<option value=${i} ${mm==i?'selected':''}>${m}`).join('')}</select></label></div><div class="box sc" style="max-height:480px;overflow-y:auto"><table><thead><tr><th>Data<th>Mês<th>Dia<th>Receita<th>Despesa<th>Meta fixa<th>Meta variável<th>Dízimo 10%<th>Reserva 2,5%</tr></thead><tbody>${c.rows.filter(r=>mm<0||r.m==mm).map(r=>`<tr><td>${r.k.split('-').reverse().join('/')}<td>${MES[r.m]}<td>${r.dia}<td>${R(r.r)}<td>${R(r.e)}<td>${R(r.fx)}<td>${R(r.vr)}<td>${R(r.diz)}<td>${R(r.res)}</tr>`).join('')}</tbody></table></div>
 <div class=f><button class=b onclick="bkp()">Baixar backup (JSON)</button><label class=note>Restaurar backup<input type=file accept=".json" onchange="rst(this.files[0])"></label></div><p class=note>Seus dados ficam salvos na sua conta (Supabase), separados dos demais usuários. Baixe um backup de vez em quando.</p>`}
function pou(){const n=[...Array(315)].map((_,i)=>i+1),on=new Set(S.poup),re=on.size,tot=[...on].reduce((a,b)=>a+b,0);
 return`<h2>Desafio dos depósitos</h2><div class=kv><div><small>Quantidade total de depósitos</small><b>315</b></div><div><small>Depósitos realizados</small><b>${re}</b></div><div><small>Dias do ano</small><b>${C.dt}</b></div><div><small>Depósitos x dias</small><b class=${cl(re-C.dt)}>${re-C.dt}</b></div><div><small>Total em depósitos</small><b>${R(tot)}</b></div><div><small>Depósitos restantes</small><b>${315-re}</b></div></div><div class="box pg">${n.map(v=>`<button class="${on.has(v)?'on':''}" aria-pressed=${on.has(v)} onclick="tg(${v})">${v}</button>`).join('')}</div><p class=note>Toque no número para marcar o depósito feito.</p>`}
function tg(v){const s=new Set(S.poup);s.has(v)?s.delete(v):s.add(v);S.poup=[...s];save();go()}
function bkp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='controle-financeiro-2026.json';a.click()}
function rst(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.lanc)throw 0;S={...NEW(),...x};save();go()}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f)}
function go(){mig();C=calc();hero();$('#nav').innerHTML=Object.entries(PF&&PF.role=='admin'?{...T,usr:'Usuários'}:T).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';edit=null;fe=null;go()">${v}</button>`).join('');$('#main').innerHTML={cons,pain,graf,det,fix,dad,pou,usr}[tab]();if(tab=='pain'){fillT();fillL()}if(tab=='usr')loadU()}
function usr(){return`<h2>Controle de usuários</h2><div class=box><div id=ul class=sc><p class=note>Carregando…</p></div></div><p class=note>Contas novas ficam pendentes até você aprovar. Cada usuário só enxerga os próprios dados.</p>`}
async function loadU(){const{data,error}=await sb.from('profiles').select('*').order('created_at');if(error)return $('#ul').innerHTML='<p class=note>Erro ao carregar usuários.</p>';
 $('#ul').innerHTML=`<table class=rs><thead><tr><th class=l>Nome<th class=l>E-mail<th>Perfil<th>Situação<th>Criado em<th></tr></thead><tbody>${data.map(u=>`<tr><td class=l data-l="Nome">${esc(u.nome)}<td class=l data-l="E-mail">${esc(u.email)}<td data-l="Perfil">${u.role=='admin'?'ADMIN':'USUÁRIO'}<td data-l="Situação"><span class="tg ${u.ativo?'ok':'pa'}">${u.ativo?'ATIVO':'PENDENTE/INATIVO'}</span><td data-l="Criado em">${u.created_at.slice(0,10).split('-').reverse().join('/')}<td class=ax>${u.id==U.id?'<span class=note>Você</span>':`<button class="b g" onclick="setU('${u.id}',{ativo:${!u.ativo}})">${u.ativo?'Desativar':'Aprovar'}</button> <button class="b g" onclick="setU('${u.id}',{role:'${u.role=='admin'?'user':'admin'}'})">${u.role=='admin'?'Tirar admin':'Tornar admin'}</button>`}</tr>`).join('')}</tbody></table>`}

 if(modo=='novo'){const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{nome:ln.value.trim()}}});if(error)return msg(error.message);if(!data.session){modoT();return msg('Conta criada. Confirme o e-mail e depois entre.',1)}}
 else{const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)return msg('E-mail ou senha inválidos.')}

 S=r&&r.data&&r.data.lanc?{...NEW(),...r.data}:NEW();S.lanc.forEach((x,i)=>x.id=x.id||i+1);if(!r)push();tela(true)}

if(SUPABASE_URL.startsWith('COLE'))msg('Configure SUPABASE_URL e SUPABASE_KEY no início do script.');else{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);abrir()}
