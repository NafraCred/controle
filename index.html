const ic=(n,s=18)=>`<svg class=ic viewBox="0 0 24 24" width=${s} height=${s} fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round aria-hidden=true>${ICO[n]}</svg>`;
const ICN={cons:'dash',pain:'edit',tip:'tag',graf:'trend',det:'pie',fix:'cal',dad:'db',pou:'piggy',usr:'users'};
const PAL=['#07edb1','#2fb6e8','#7c8cf8','#f5a524','#ff7b7f','#a3e635','#8fa3b5'];
const K=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+'M':n>=1e3?(n/1e3).toFixed(1).replace('.',',')+'k':Math.round(n)+'';
const byT=f=>{const g={};S.lanc.forEach(x=>{if(x.f==f&&x.t)g[x.t]=(g[x.t]||0)+x.v});return Object.entries(g)};
function ring(p,sz=56){p=Math.max(0,Math.min(1,p||0))*100;return`<svg viewBox="0 0 42 42" width=${sz} height=${sz} role=img aria-label="${Math.round(p)}%" style="flex:none"><circle r=15.9155 cx=21 cy=21 fill=none stroke="var(--ln)" stroke-width=5 /><circle r=15.9155 cx=21 cy=21 fill=none stroke="var(--ac)" stroke-width=5 stroke-linecap=round stroke-dasharray="${p} ${100-p}" stroke-dashoffset=25 ${p>0?'':'opacity=0'} /><text x=21 y=23.6 text-anchor=middle style="font:700 8px var(--fd);fill:var(--ink)">${Math.round(p)}%</text></svg>`}
function donut(a){a=a.filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]);if(a.length>6){const o=a.slice(6).reduce((n,x)=>n+x[1],0);a=a.slice(0,6).concat([['OUTROS',o]])}
 const tot=a.reduce((n,x)=>n+x[1],0);if(!tot)return'<p class=note>Sem dados no período.</p>';let off=25;
 const seg=a.map((x,i)=>{const p=x[1]/tot*100,s=`<circle r=15.9155 cx=21 cy=21 fill=none stroke="${PAL[i]}" stroke-width=6 stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p;return s}).join('');
 return`<div class=dn><svg viewBox="0 0 42 42" width=150 height=150 role=img aria-label="Gráfico de rosca" style="flex:none"><circle r=15.9155 cx=21 cy=21 fill=none stroke="var(--ln)" stroke-width=6 />${seg}<text x=21 y=22.6 text-anchor=middle style="font:700 4.4px var(--fd);fill:var(--ink)">R$ ${K(tot)}</text></svg><div class=leg>${a.map((x,i)=>`<div><i class=dot style="background:${PAL[i]}"></i><span>${esc(x[0])}</span><b>${P(x[1]/tot)}</b></div>`).join('')}</div></div>`}
function bars(MS){const mx=Math.max(1,...MS.flatMap(o=>[o.r,o.e]));
 return`<div class=bars>${MS.map((o,i)=>`<div class=bc title="${MES[i]}: receita ${R(o.r)} · despesa ${R(o.e)}"><div class=bp><i class=br style="height:${o.r/mx*100}%"></i><i class=bd style="height:${o.e/mx*100}%"></i></div><span>${MES[i]}</span></div>`).join('')}</div><div class=leg2><span><i class=dot style="background:var(--ac)"></i>Receita</span><span><i class=dot style="background:var(--des)"></i>Despesa</span></div>`}
function dash(t,MS){const pc=S.cfg.meta?t.r/S.cfg.meta:0;
 return`<div class=kp><div class=c><span class="ki i-g">${ic('up',22)}</span><div><small>Receita</small><b>${R(t.r)}</b></div></div><div class=c><span class="ki i-r">${ic('down',22)}</span><div><small>Despesa</small><b>${R(t.e)}</b></div></div><div class=c><span class="ki i-b">${ic('wallet',22)}</span><div><small>Saldo</small><b class=${cl(t.sa)}>${R(t.sa)}</b></div></div><div class=c>${ring(pc,52)}<div><small>Meta do ano</small><b>${R(S.cfg.meta)}</b></div></div></div><div class=g2><div class=box><span class=bt>Receita × despesa por mês</span>${bars(MS)}</div><div class=box><span class=bt>Despesas por tipo</span>${donut(byT('DESPESA'))}</div></div>`}

 return`<h2>Desafio dos depósitos</h2><div class="kp one"><div class=c>${ring(re/315,64)}<div><small>Progresso do desafio</small><b>${P(re/315)}</b><span class=note>${re} de 315 depósitos</span></div></div></div><div class=kv><div><small>Quantidade total de depósitos</small><b>315</b></div><div><small>Depósitos realizados</small><b>${re}</b></div><div><small>Dias do ano</small><b>${C.dt}</b></div><div><small>Depósitos x dias</small><b class=${cl(re-C.dt)}>${re-C.dt}</b></div><div><small>Total em depósitos</small><b>${R(tot)}</b></div><div><small>Depósitos restantes</small><b>${315-re}</b></div></div><div class="box pg">${n.map(v=>`<button class="${on.has(v)?'on':''}" aria-pressed=${on.has(v)} onclick="tg(${v})">${v}</button>`).join('')}</div><p class=note>Toque no número para marcar o depósito feito.</p>`}
function tg(v){const s=new Set(S.poup);s.has(v)?s.delete(v):s.add(v);S.poup=[...s];save();go()}
function bkp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='controle-financeiro-2026.json';a.click()}
function rst(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.lanc)throw 0;S={...NEW(),...x};save();go()}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f)}
function go(){mig();C=calc();hero();$('#nav').innerHTML=Object.entries(PF&&PF.role=='admin'?{...T,usr:'Usuários'}:T).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';edit=null;fe=null;go()">${ic(ICN[k])}${v}</button>`).join('');$('#main').innerHTML={cons,pain,tip,graf,det,fix,dad,pou,usr}[tab]();if(tab=='pain'){fillT();fillL()}if(tab=='tip')renderT();if(tab=='usr')loadU()}
function usr(){return`<h2>Controle de usuários</h2><div class=box><div id=ul class=sc><p class=note>Carregando…</p></div></div><p class=note>Contas novas ficam pendentes até você aprovar. Cada usuário só enxerga os próprios dados.</p>`}
async function loadU(){const{data,error}=await sb.from('profiles').select('*').order('created_at');if(error)return $('#ul').innerHTML='<p class=note>Erro ao carregar usuários.</p>';
 $('#ul').innerHTML=`<table class=rs><thead><tr><th class=l>Nome<th class=l>E-mail<th>Perfil<th>Situação<th>Criado em<th></tr></thead><tbody>${data.map(u=>`<tr><td class=l data-l="Nome">${esc(u.nome)}<td class=l data-l="E-mail">${esc(u.email)}<td data-l="Perfil">${u.role=='admin'?'ADMIN':'USUÁRIO'}<td data-l="Situação"><span class="tg ${u.ativo?'ok':'pa'}">${u.ativo?'ATIVO':'PENDENTE/INATIVO'}</span><td data-l="Criado em">${u.created_at.slice(0,10).split('-').reverse().join('/')}<td class=ax>${u.id==U.id?'<span class=note>Você</span>':`<button class="b g" onclick="setU('${u.id}',{ativo:${!u.ativo}})">${u.ativo?'Desativar':'Aprovar'}</button> <button class="b g" onclick="setU('${u.id}',{role:'${u.role=='admin'?'user':'admin'}'})">${u.role=='admin'?'Tirar admin':'Tornar admin'}</button>`}</tr>`).join('')}</tbody></table>`}
async function setU(id,p){const{error}=await sb.from('profiles').update(p).eq('id',id);if(error)alert(error.message);loadU()}
const msg=(x,ok)=>{le.textContent=x;le.className=ok?'note':'n'};
function modoT(){modo=modo=='novo'?'in':'novo';lnw.hidden=modo!='novo';lsb.textContent=modo=='novo'?'Criar conta':'Entrar';lt.textContent=modo=='novo'?'Já tenho conta':'Criar conta';lp.autocomplete=modo=='novo'?'new-password':'current-password';msg('')}
async function entrarSB(e){e.preventDefault();msg('');const em=lu.value.trim(),pw=lp.value;
 if(modo=='novo'){const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{nome:ln.value.trim()}}});if(error)return msg(error.message);if(!data.session){modoT();return msg('Conta criada. Confirme o e-mail e depois entre.',1)}}
 else{const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)return msg('E-mail ou senha inválidos.')}
 lp.value='';abrir()}
async function abrir(){const{data:{session}}=await sb.auth.getSession();if(!session)return tela(false);U=session.user;
 const{data:p}=await sb.from('profiles').select('*').eq('id',U.id).maybeSingle();PF=p;
 if(!p||!p.ativo){await sb.auth.signOut();U=PF=null;tela(false);return msg(p?'Conta criada. Aguarde a aprovação do administrador para entrar.':'Perfil não encontrado. Rode o SQL de configuração no Supabase.',!!p)}
 const{data:r,error}=await sb.from('finance_data').select('data').eq('user_id',U.id).maybeSingle();
 if(error){tela(false);return msg('Erro ao carregar seus dados: '+error.message)}
 S=r&&r.data&&r.data.lanc?{...NEW(),...r.data}:NEW();S.lanc.forEach((x,i)=>x.id=x.id||i+1);if(!r)push();tela(true)}
async function sair(){await sb.auth.signOut();U=PF=null;S=NEW();tab='cons';tela(false)}
function tela(ok){$('#lg').hidden=ok;$('#app').hidden=!ok;if(ok){$('#who').textContent=PF.nome||PF.email;stat('');go()}}
if(SUPABASE_URL.startsWith('COLE'))msg('Configure SUPABASE_URL e SUPABASE_KEY no início do script.');else{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);abrir()}
